<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Mobile browser chrome matches the (always dark) top bar -->
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <title>Assistant</title>
    <script>
      // Apply the theme before first paint to avoid a light flash in dark
      // mode. Same rule as src/theme/theme.ts; ThemeProvider takes over.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('assistant.theme');
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
