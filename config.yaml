# Assistant Configuration

# Database connection parameters
database:
  host: localhost
  port: 5432
  user: assistant
  password: assistant
  name: assistant
  # Alternative: use DATABASE_URL environment variable to override all above
  # DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant

# Document storage path (can be overridden with DOCUMENT_STORAGE_PATH env var)
document_storage_path: data/documents

# File (attachment) storage path (can be overridden with FILE_STORAGE_PATH env var)
file_storage_path: data/files

# Where note-import zips are uploaded and extracted; each is deleted after its
# import (can be overridden with IMPORT_STORAGE_PATH env var)
import_storage_path: data/imports

# Largest import zip accepted, in bytes (IMPORT_MAX_UPLOAD_BYTES env var)
import_max_upload_bytes: 524288000  # 500 MB

# External source configurations
external_sources:
  fake:
    # Fake provider configuration for testing
    enabled: true
    # Add any fake-specific configuration here
  evernote:
    # Nothing to be configured here

# The assistant's own domain (also used as the Mailgun sending domain)
domain: mynotes.my

# Set to true to omit `:{port}` from externally-facing URLs (invite links,
# the Google OAuth redirect URI, post-login redirects, confirmation-email
# links) — e.g. when the app sits behind a reverse proxy on the standard
# port (443).
# omit_port: false  # optional, this is the default

# use_https: true  # optional, defaults to true. Set to false for local/test http.

# Mailgun configuration (apikey is always supplied via MAILGUN_APIKEY env var)
mailgun:
  apiurl: https://api.mailgun.net/v3
  sender: noreply@mynotes.my
  # timeout: 10  # optional, defaults to 10 seconds

# Google OAuth2 (client_secret is always supplied via GOOGLE_CLIENT_SECRET env var).
# redirect_path is appended to the app's public origin (see `domain`/`port`/
# `omit_port`/`use_https` above) to form the redirect URI you register in
# the Google Cloud Console.
google:
  redirect_path: /auth/google/callback  # optional, this is the default
  # Reject a Google re-authentication (before switching to password sign-in)
  # unless Google reports a sign-in in the last 5 minutes. Needs a verified
  # app with "Session age claims" enabled in the Cloud Console.
  # require_auth_time: false  # optional, this is the default

# Sentry (dsn is always supplied via SENTRY_DSN env var; omit it to disable)
sentry:
  environment: development
  # traces_sample_rate: 1.0            # optional, this is the default
  # profile_session_sample_rate: 1.0   # optional, this is the default
