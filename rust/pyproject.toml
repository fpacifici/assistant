[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "assistant-rust"
version = "0.1.0"
description = "Backend code of the assistant package written in Rust"
requires-python = ">=3.13"

[tool.uv]
# Rebuild on `uv sync` when any of these change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "assistant_rust.pyi" },
]
