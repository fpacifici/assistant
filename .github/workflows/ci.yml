name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # For tests marked `postgres` (e.g. search); same image as docker-compose.yml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build the Go library
        run: make go-build

      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files

      - name: Run Go tests
        run: make go-test

      - name: Run tests
        run: uv run pytest tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile fails if the image cannot call into the Go library.
      - name: Build API image
        run: make docker-build
